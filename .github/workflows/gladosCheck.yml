name: auto check

on:
  workflow_dispatch:
  push:
    branches: [ master ]
    paths-ignore:
      - 'README.md'
      - 'imgs/**'
  schedule:
    # 北京时间 09:18 / 12:18（UTC 01:18 / 04:18），避开整点高峰
    - cron: '18 1,4 * * *'

jobs:
  checkin:
    name: glados checkin
    runs-on: windows-latest
    timeout-minutes: 20

    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 用 Playwright 自带 Chromium，保持版本可控
      - name: Install Playwright Chromium
        run: python -m playwright install chromium

      # Cloudflare Turnstile 在 headless 下 tsState=error（拿不到 token），必须 headful。
      # windows-latest 自带交互式桌面会话，可原生 headful 运行，且 UA/系统与登录设备一致，
      # 不会触发 code=4 device-mismatch。
      - name: Running checkin
        run: python checkin.py
        env:
          GLADOS_COOKIES: ${{ secrets.GLADOS_COOKIES }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          GLADOS_HEADLESS: '0'
          GLADOS_RETRY: '3'
          PYTHONIOENCODING: 'utf-8'

      - name: Keep alive
        if: always()
        uses: liskin/gh-workflow-keepalive@v1

      - name: Delete workflow runs
        if: always()
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 7
          keep_minimum_runs: 7
          delete_run_by_conclusion_pattern: success