name: auto check

on:
  workflow_dispatch:
  push:
    branches: [ master ]
    paths-ignore:
      - 'README.md'
      - 'imgs/**'
  schedule:
    # 北京时间 08:00 / 12:00（UTC 00:00 / 04:00）
    - cron: '0 0,4 * * *'

jobs:
  checkin:
    name: glados checkin
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      actions: write

    env:
      # 有求解服务 key 时走 api 引擎（推荐，稳定）；没有则回退浏览器引擎
      TURNSTILE_API_KEY: ${{ secrets.TURNSTILE_API_KEY }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 仅在没有求解服务时，才需要浏览器兜底
      - name: Install Playwright Chromium
        if: env.TURNSTILE_API_KEY == ''
        run: python -m playwright install --with-deps chromium

      - name: Install Xvfb (browser fallback)
        if: env.TURNSTILE_API_KEY == ''
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb

      - name: Running checkin (api engine)
        if: env.TURNSTILE_API_KEY != ''
        run: python checkin.py
        env:
          GLADOS_COOKIES: ${{ secrets.GLADOS_COOKIES }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          TURNSTILE_PROVIDER: ${{ secrets.TURNSTILE_PROVIDER }}
          TURNSTILE_API_KEY: ${{ secrets.TURNSTILE_API_KEY }}
          GLADOS_PROXY: ${{ secrets.GLADOS_PROXY }}
          PYTHONIOENCODING: 'utf-8'

      - name: Running checkin (browser engine)
        if: env.TURNSTILE_API_KEY == ''
        run: xvfb-run -a --server-args="-screen 0 1440x900x24" python checkin.py
        env:
          GLADOS_COOKIES: ${{ secrets.GLADOS_COOKIES }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          GLADOS_HEADLESS: '0'
          GLADOS_RETRY: '3'
          GLADOS_PROXY: ${{ secrets.GLADOS_PROXY }}
          PYTHONIOENCODING: 'utf-8'

      - name: Keep alive
        if: always()
        uses: liskin/gh-workflow-keepalive@v1

      - name: Delete workflow runs
        if: always()
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 7
          keep_minimum_runs: 7
          delete_run_by_conclusion_pattern: success